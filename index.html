<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Book</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b2430; --muted:#6b7686; --line:#dfe3e8; --accent:#2457d6; --danger:#c43b3b; --ok:#1f7a45; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --ink:#e8ecf1; --muted:#98a3b3; --line:#2b3441; --accent:#6c93f5; --danger:#e26a6a; --ok:#58c487; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:580px; margin:0 auto; padding:28px 16px 64px; }
  h1 { font-size:1.55rem; margin:0; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:grid; gap:4px; font-size:.9rem; color:var(--muted); margin-bottom:10px; }
  input { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; width:100%; }
  input:focus-visible, button:focus-visible, summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.6; cursor:wait; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .ai h2 { font-size:1rem; margin:0 0 8px; }
  .ai .row input { flex:1; min-width:200px; }
  #msg { min-height:1.4em; margin:0 0 12px; font-size:.92rem; white-space:pre-line; }
  #msg.err { color:var(--danger); } #msg.ok { color:var(--ok); }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .name { font-weight:600; overflow-wrap:anywhere; } .phone { color:var(--muted); font-size:.95rem; }
  .empty { color:var(--muted); text-align:center; padding:20px 0; }
  details summary { cursor:pointer; color:var(--muted); margin-bottom:8px; }
  .hint { color:var(--muted); font-size:.85rem; margin:8px 0 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <!-- LOGIN / SIGN UP -->
  <section id="authView" class="card">
    <h1>Contact Book</h1>
    <p class="hint" style="margin-bottom:14px">Log in or create an account to manage your contacts.</p>
    <label>Email <input id="email" type="email" autocomplete="email"></label>
    <label>Password <input id="password" type="password" autocomplete="current-password"></label>
    <div class="row">
      <button class="primary" id="loginBtn">Log in</button>
      <button id="signupBtn">Sign up</button>
    </div>
  </section>

  <!-- APP -->
  <section id="appView" hidden>
    <div class="top">
      <h1>Contact Book</h1>
      <button id="logoutBtn">Log out</button>
    </div>

    <div class="card ai">
      <h2>Tell me what to do</h2>
      <div class="row">
        <input id="aiText" maxlength="300" placeholder="e.g. add Ali, his number is 03001234567" autocomplete="off">
        <button class="primary" id="aiBtn">Run</button>
      </div>
      <p class="hint">Try: "update Ali's number to 03111234567" or "delete Ali". An AI model reads your sentence and picks the action.</p>
    </div>

    <div id="msg" role="status"></div>

    <details class="card">
      <summary>Add manually</summary>
      <label>Name <input id="mName" maxlength="100" autocomplete="off"></label>
      <label>Phone number <input id="mPhone" type="tel" maxlength="20" autocomplete="off"></label>
      <div class="row">
        <button class="primary" id="mSave">Save contact</button>
        <button id="mCancel" hidden>Cancel edit</button>
      </div>
    </details>

    <ul id="list"></ul>
  </section>
</main>

<script>
// ====== PASTE YOUR SUPABASE VALUES HERE (same two as before) ======
const SUPABASE_URL = 'https://svbkzahpymxdzbznlbav.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5Tm6EWmGvDXy0-YqlJjYFA_RHLwzM_p';
// ==================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
let session = null, contacts = [], editingId = null;

function say(text, kind) { const m = $('msg'); m.textContent = text || ''; m.className = kind || ''; }

/* ---------- auth ---------- */
async function showForSession(s) {
  session = s;
  $('authView').hidden = !!s;
  $('appView').hidden = !s;
  if (s) { say(''); await load(); }
}
$('loginBtn').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value, password: $('password').value });
  if (error) alert(error.message);
};
$('signupBtn').onclick = async () => {
  const { data, error } = await sb.auth.signUp({ email: $('email').value, password: $('password').value });
  if (error) return alert(error.message);
  if (!data.session) alert('Account created. Check your email to confirm, then log in.');
};
$('logoutBtn').onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange((_e, s) => showForSession(s));
sb.auth.getSession().then(({ data }) => showForSession(data.session));

/* ---------- database ---------- */
async function load() {
  const { data, error } = await sb.from('contacts').select('*').order('name');
  if (error) return say(error.message, 'err');
  contacts = data;
  render();
}
const dbAdd = (name, phone) => sb.from('contacts').insert({ name, phone, user_id: session.user.id });
const dbUpdate = (id, fields) => sb.from('contacts').update(fields).eq('id', id);
const dbDelete = (id) => sb.from('contacts').delete().eq('id', id);

function render() {
  const list = $('list');
  list.replaceChildren();
  if (!contacts.length) {
    const p = document.createElement('p'); p.className = 'empty';
    p.textContent = 'No contacts yet. Type an instruction above.';
    return list.append(p);
  }
  for (const c of contacts) {
    const li = document.createElement('li');
    const info = document.createElement('div');
    const n = document.createElement('div'); n.className = 'name'; n.textContent = c.name;
    const p = document.createElement('div'); p.className = 'phone'; p.textContent = c.phone;
    info.append(n, p);
    const row = document.createElement('div'); row.className = 'row';
    const ed = document.createElement('button'); ed.textContent = 'Edit';
    ed.onclick = () => {
      editingId = c.id; $('mName').value = c.name; $('mPhone').value = c.phone;
      $('mSave').textContent = 'Save changes'; $('mCancel').hidden = false;
      document.querySelector('details').open = true; $('mName').focus();
    };
    const del = document.createElement('button'); del.textContent = 'Delete'; del.className = 'danger';
    del.onclick = async () => {
      if (!confirm('Delete ' + c.name + '?')) return;
      const { error } = await dbDelete(c.id);
      error ? say(error.message, 'err') : (say('Deleted ' + c.name + '.', 'ok'), load());
    };
    row.append(ed, del); li.append(info, row); list.append(li);
  }
}

/* ---------- manual form (backup) ---------- */
function resetManual() { editingId = null; $('mName').value = ''; $('mPhone').value = ''; $('mSave').textContent = 'Save contact'; $('mCancel').hidden = true; }
$('mCancel').onclick = resetManual;
$('mSave').onclick = async () => {
  const name = $('mName').value.trim(), phone = $('mPhone').value.trim();
  if (!name || !phone) return say('Enter both a name and a phone number.', 'err');
  const { error } = editingId ? await dbUpdate(editingId, { name, phone }) : await dbAdd(name, phone);
  if (error) return say(error.message, 'err');
  say(editingId ? 'Contact updated.' : 'Contact added.', 'ok'); resetManual(); load();
};

/* ---------- AI box: text -> LLM -> tool call -> CRUD ---------- */
function findContact(name) {
  const n = (name || '').trim().toLowerCase();
  let m = contacts.filter((c) => c.name.toLowerCase() === n);
  if (!m.length) m = contacts.filter((c) => c.name.toLowerCase().includes(n));
  return m;
}

async function runAction(a) {
  if (a.action === 'clarify') return { ok: false, text: a.question };
  if (a.action === 'add_contact') {
    const { error } = await dbAdd(a.name, a.phone);
    return error ? { ok: false, text: error.message } : { ok: true, text: `Added ${a.name} (${a.phone}).` };
  }
  const m = findContact(a.name);
  if (m.length !== 1) {
    return { ok: false, text: m.length ? `More than one contact matches "${a.name}". Use the full name.` : `No contact named "${a.name}".` };
  }
  const c = m[0];
  if (a.action === 'update_contact') {
    const fields = {};
    if (a.new_phone) fields.phone = a.new_phone;
    if (a.new_name) fields.name = a.new_name;
    if (!Object.keys(fields).length) return { ok: false, text: 'Tell me the new number or new name.' };
    const { error } = await dbUpdate(c.id, fields);
    return error ? { ok: false, text: error.message } : { ok: true, text: `Updated ${c.name}.` };
  }
  if (a.action === 'delete_contact') {
    const { error } = await dbDelete(c.id);
    return error ? { ok: false, text: error.message } : { ok: true, text: `Deleted ${c.name}.` };
  }
  return { ok: false, text: 'Unknown action.' };
}

async function runAI() {
  const text = $('aiText').value.trim();
  if (!text) return say('Type an instruction first.', 'err');
  $('aiBtn').disabled = true; say('Thinking...');
  try {
    const r = await fetch('/api/parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify({ text, contacts }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Request failed.');

    const lines = []; let allOk = true;
    for (const a of data.actions) {
      const res = await runAction(a);
      lines.push(res.text); if (!res.ok) allOk = false;
      await load();
    }
    say(lines.join('\n') || 'Nothing to do.', allOk ? 'ok' : 'err');
    if (allOk) $('aiText').value = '';
  } catch (e) { say(e.message, 'err'); }
  $('aiBtn').disabled = false;
}
$('aiBtn').onclick = runAI;
$('aiText').addEventListener('keydown', (e) => { if (e.key === 'Enter') runAI(); });
</script>
</body>
</html>
